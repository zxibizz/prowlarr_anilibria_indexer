---
# AniLibria / AniLiberty custom indexer for Prowlarr.
#
# Drop this file into Prowlarr's custom definitions folder:
#   Docker : /config/Definitions/Custom/anilibria.yml
#   Linux  : ~/.config/Prowlarr/Definitions/Custom/anilibria.yml
#   macOS  : ~/Library/Application Support/Prowlarr/Definitions/Custom/anilibria.yml
#   Windows: C:\ProgramData\Prowlarr\Definitions\Custom\anilibria.yml
#
# AniLibria's API requires two round trips to turn a keyword search into
# torrents, which the Cardigann engine (one request per search) cannot do. The
# search path below is therefore handled by the companion proxy in ../proxy,
# which is set as an "Http" indexer proxy in Prowlarr:
#
#   * this route is answered by the proxy with the flattened rows parsed here,
#   * every other request Prowlarr makes - release pages, .torrent downloads,
#     its own proxy health check - is relayed to the real site untouched.
#
# Categories, titles, dates and download URLs are all still handled here.
#
# Note the site moved from anilibria.tv to aniliberty.top; the old
# api.anilibria.tv v3 API now answers HTTP 410 Gone.
#
# API docs: https://aniliberty.top/api/docs/v1

id: anilibria
name: AniLibria
description: "AniLibria is a Russian anime distribution platform. Requires the companion anilibria-proxy to be set as an Http indexer proxy."
language: ru-RU
type: public
encoding: UTF-8
links:
  - https://aniliberty.top/

caps:
  # release.type is one of TV, WEB, OVA, ONA, OAD, SPECIAL, MOVIE, DORAMA, so the
  # mapping ids are the API values and no template is needed to pick one.
  categorymappings:
    - {id: TV, cat: TV/Anime, desc: "Аниме ТВ", default: true}
    - {id: WEB, cat: TV/Anime, desc: "Аниме WEB"}
    - {id: OVA, cat: TV/Anime, desc: "Аниме OVA"}
    - {id: ONA, cat: TV/Anime, desc: "Аниме ONA"}
    - {id: OAD, cat: TV/Anime, desc: "Аниме OAD"}
    - {id: SPECIAL, cat: TV/Anime, desc: "Аниме спешл"}
    - {id: MOVIE, cat: Movies/Other, desc: "Аниме фильмы"}
    - {id: DORAMA, cat: TV, desc: "Дорамы"}

  modes:
    search: [q]

# Deliberately no custom settings.
#
# Prowlarr resolves every non-standard field the UI submits against the
# definition the server has loaded:
#
#     var cardigannSetting = cardigannDefinition.Settings.FirstOrDefault(x => x.Name == field.Name);
#     if (cardigannSetting == null)
#         throw new ArgumentOutOfRangeException(field.Name, "Unknown Cardigann setting.");
#
# so a custom `settings` entry that the server cannot resolve (a stale cached
# definition, or a build that does not read them from Custom/) makes the indexer
# impossible to save. Nothing here needs one.
settings: []

search:
  paths:
    # Answered by the proxy, never by the site. It must be a literal absolute
    # URL: Prowlarr decides whether a path is absolute (and therefore not
    # prefixed with the site link) by parsing the raw string, before any
    # template is substituted.
    #
    # The host is the real site so the URL still resolves when the proxy is not
    # in play -- you get a 404 from the site rather than a DNS error. Where the
    # proxy actually runs is Prowlarr's "Http" indexer proxy setting, so this
    # line never needs to change. Keep it in step with PROXY_DIVERT_PREFIX.
    - path: "http://aniliberty.top/_anilibria_proxy/search"
      response:
        type: json

  inputs:
    q: "{{ .Keywords }}"
    # Only used for keyword-less searches (indexer test, RSS sync); the API
    # caps /anime/torrents at 50 and the proxy clamps anyway.
    limit: 50

  rows:
    selector: rows

  fields:
    # --- working values (must be declared before the fields that use them) ---
    _alias:
      selector: release.alias
      optional: true

    infohash:
      selector: torrent.hash

    # Prowlarr's template engine has no `else if`, so branching is avoided
    # entirely: the category id is the API's own release.type value.
    category:
      selector: release.type
      optional: true
      default: TV

    title:
      selector: torrent.label

    # The torrent hash is part of the URL so that releases with several torrents
    # (different quality, codec or episode range) get distinct GUIDs.
    # The site is hardcoded because the definition cannot declare a setting for
    # it, and .Config.sitelink comes from the Base Url dropdown, which can be
    # empty for custom definitions.
    details:
      text: "https://aniliberty.top/anime/releases/release/{{ .Result._alias }}/{{ .Result.infohash }}"

    download:
      text: "https://aniliberty.top/api/v1/anime/torrents/{{ .Result.infohash }}/file"

    magnet:
      selector: torrent.magnet
      optional: true

    size:
      selector: torrent.size

    seeders:
      selector: torrent.seeders

    leechers:
      selector: torrent.leechers
      optional: true

    grabs:
      selector: torrent.grabs
      optional: true

    date:
      selector: torrent.updated_at

    year:
      selector: release.year
      optional: true

    poster:
      selector: release.poster
      optional: true
      filters:
        - name: re_replace
          args: ["^/", "https://aniliberty.top/"]

    description:
      selector: release.description
      optional: true

    # AniLibria is free to download and does not count upload.
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
# cardigann engine
