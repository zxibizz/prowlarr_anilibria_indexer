---
# Prowlarr instance for developing and testing the custom AniLiberty indexer.
#
#   docker compose up -d --build   start (builds the proxy image)
#   docker compose logs -f         follow logs
#   docker compose down            stop
#
# Two services:
#   prowlarr          the indexer host; ./definitions is mounted into its
#                     "Custom" definitions folder, the only definitions folder
#                     Prowlarr never overwrites when refreshing built-ins.
#   anilibria-proxy   a forward HTTP proxy. Prowlarr uses it as an "Http" indexer
#                     proxy: the definition's search route is answered here, and
#                     every other request is relayed to the real site.

services:
  anilibria-proxy:
    build: ./proxy
    image: anilibria-proxy:local
    container_name: anilibria-proxy
    environment:
      - ANILIBRIA_API_BASE=https://aniliberty.top/api/v1
      # How many matched releases to expand into torrents per search.
      - PROXY_MAX_RELEASES=10
      # Politeness delay between those per-release requests, in seconds.
      - PROXY_REQUEST_DELAY=0.2
      - PROXY_CACHE_TTL=300
      # The path the proxy answers itself; everything else is relayed.
      - PROXY_DIVERT_PREFIX=/_anilibria_proxy
      - PROXY_PORT=8788
    ports:
      # Published so you can poke at the proxy from the host while developing.
      # Prowlarr itself reaches it over the compose network as anilibria-proxy:8788.
      - "8788:8788"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      # Keep the definition bundle from being refreshed over our work while testing.
      # Remove/hide this once you rely on built-in definitions again.
      # - PROWLARR__UPDATE__MECHANISM=external
    volumes:
      - ./config:/config
      # Only the custom definitions folder is bind-mounted so the container's
      # own Definitions/*.yml bundle cannot clobber our file.
      - ./definitions:/config/Definitions/Custom
    ports:
      - "9696:9696"
    extra_hosts:
      # Lets the container reach services running on the macOS/Linux host, e.g.
      # a proxy you run outside this compose stack.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

